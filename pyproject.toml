[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-database-analyst"
version = "0.3.0"
description = "Local, read-only natural-language analytics for any MySQL business database: Ollama -> SQLGlot validation -> MySQL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["text-to-sql", "analytics", "streamlit", "ollama", "mysql", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "mysql-connector-python>=8.0,<27",
    "pandas>=2.0,<4",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
    "sqlglot>=25.0,<31",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "build>=1.0"]

[project.scripts]
ai-database-analyst = "ai_database_analyst.cli:main"

[tool.setuptools.packages.find]
include = ["ai_database_analyst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ai_database_analyst"]
omit = ["ai_database_analyst/ui.py", "ai_database_analyst/streamlit_app.py", "ai_database_analyst/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"ai_database_analyst/prompts.py" = ["E501"]
"tests/*" = ["E501"]
