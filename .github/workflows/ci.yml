name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=ai_database_analyst --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean environment and run the CLI
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/ai-database-analyst --version

  docker:
    name: Docker image and compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          python scripts/init_secrets.py
          docker compose config --quiet
      - name: Build image
        run: docker build -t ai-database-analyst:ci .
      - name: Image runs the CLI as a non-root user
        run: |
          docker run --rm ai-database-analyst:ci python -m ai_database_analyst --version
          test "$(docker run --rm ai-database-analyst:ci id -u)" != "0"

  audit:
    name: Dependency vulnerability scan (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true  # new advisories appear independently of code changes; review, do not block merges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
